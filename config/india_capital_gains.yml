# Verify each financial year.
#
# Indicative capital-gains rules for resident individuals, as amended by the Finance (No. 2) Act 2024
# (carried into the Income-tax Act 2025 for tax year 2026-27). Surcharge, 4% cess, the 87A rebate and
# carry-forward of losses are NOT modelled. Edit this file when the rules change; no code change is needed.
#
# Conventions
#   * Rate lists are effective-dated by TRANSFER (sale) date: the entry with the latest
#     `effective_from` that is on or before the sale date applies.
#   * `long_term_after_months`: long-term only if held for MORE than this many months.
#   * Rates are percentages. `slab` means "taxed at the taxpayer's slab rate".
#   * `indexation: true` means the old rule allowed indexation, which is not computed here.

grandfathering:
  # Equity lots bought on or before this date: cost = max(actual cost, min(FMV on this date, sale price)).
  # FMV is not available, so actual cost is used and a warning is shown.
  cutoff: 2018-01-31

# Section 112A exemption on long-term equity gains, per person per financial year.
ltcg_equity_exemption:
  - effective_from: 2000-04-01
    amount: 100000
  - effective_from: 2024-04-01
    amount: 125000

categories:
  # Listed shares and equity-oriented MFs/ETFs (65% or more domestic equity)
  equity:
    bucket: equity
    rules:
      - effective_from: 1900-01-01
        long_term_after_months: 12
        stcg_rate: 15
        ltcg_rate: 10
        exemption_eligible: true
      - effective_from: 2024-07-23
        long_term_after_months: 12
        stcg_rate: 20
        ltcg_rate: 12.5
        exemption_eligible: true

  # Specified mutual funds (Sec 50AA): lots bought on or after the date below are always taxed at slab rate.
  # Older lots are treated like `other_unlisted`.
  debt:
    purchase_rules:
      - purchased_on_or_after: 2023-04-01
        always_slab: true
        note: "Specified mutual fund (Sec 50AA): taxed at slab rate regardless of holding period."
      - purchased_on_or_after: 1900-01-01
        use_category: other_unlisted

  # Hybrid funds (35-65% equity), gold/international FoFs, pre-April-2023 debt fund lots
  other_unlisted:
    bucket: other
    rules:
      - effective_from: 1900-01-01
        long_term_after_months: 36
        stcg_rate: slab
        ltcg_rate: 20
        indexation: true
        note: "Long-term gains were taxed at 20% with indexation before 23 Jul 2024. Indexation is not computed."
      - effective_from: 2024-07-23
        long_term_after_months: 24
        stcg_rate: slab
        ltcg_rate: 12.5

  # Gold ETFs, non-equity ETFs, listed bonds, SGB sold on exchange.
  # The pre-23-Jul-2024 entry is less certain (gold ETFs followed the 36-month / 20% indexed rule).
  other_listed:
    bucket: other
    rules:
      - effective_from: 1900-01-01
        long_term_after_months: 36
        stcg_rate: slab
        ltcg_rate: 20
        indexation: true
        note: "Pre 23 Jul 2024 rule approximated as 36 months / 20% with indexation. Verify for your instrument."
      - effective_from: 2024-07-23
        long_term_after_months: 12
        stcg_rate: slab
        ltcg_rate: 12.5

  # Sovereign Gold Bonds redeemed with RBI at maturity
  exempt:
    exempt: true

# ---------------------------------------------------------------------------------------------------
# Residential status (resident vs NRI). Verify each financial year.
#
# Capital-gains RATES and the Sec 112A exemption above are the same for residents and NRIs, so this
# section only holds what DIFFERS: the TDS an AMC / broker deducts from an NRI's sale proceeds (Sec 195),
# default slab rates, interest-income rules and the notes shown for each status. All TDS figures are
# ESTIMATES: surcharge and DTAA relief are not modelled and the 4% cess is added on top of the rates.
# `effective_from` lists are keyed by the TRANSFER date, like the rates above.
# ---------------------------------------------------------------------------------------------------
residency:
  # Slab rate to start from when a member has none set. Residents are asked for theirs.
  default_slab_rate:
    nri: 30

  nri:
    tds:
      cess_percent: 4
      surcharge_note: "Surcharge (10% to 37%, depending on total income) is not included. The AMC or broker adds it when the gain is large."
      dtaa_note: "Relief under a double taxation avoidance agreement (DTAA) is not modelled. Claim it with a lower-deduction certificate or when you file your return."
      # TDS rates by what is sold, in % before cess. Effective-dated by sale date.
      rates:
        - effective_from: 1900-01-01
          equity_stcg: 15      # Sec 111A before 23 Jul 2024
          equity_ltcg: 10      # Sec 112A before 23 Jul 2024
          debt_mf: 30          # specified (debt) mutual fund, taxed at the NRI's slab rate: TDS at 30%
          other_stcg: 30       # other short-term gains taxed at slab: TDS at 30%
          other_ltcg: 20       # Sec 112 (with indexation before 23 Jul 2024)
        - effective_from: 2024-07-23
          equity_stcg: 20
          equity_ltcg: 12.5
          debt_mf: 30
          other_stcg: 30
          other_ltcg: 12.5
      # VERIFY: whether the AMC / broker lets the Rs 1.25 lakh Sec 112A exemption reduce the NRI's TDS.
      # In practice TDS is deducted on the whole gain and the exemption is claimed as a refund when the
      # return is filed, so the estimate below does NOT apply the exemption. Confirm with your AMC.
      ltcg_equity_exemption_reduces_tds: false
    notes:
      - "As an NRI, the AMC or broker deducts TDS from every sale at the rates below, on the gain, before paying you."
      - "The Rs 1.25 lakh exemption on equity LTCG applies to NRIs too, but TDS is usually deducted on the whole gain. You claim the difference as a refund in your Indian return."
      - "Unused basic exemption limit cannot be set off against capital gains, and the Sec 87A rebate is not available."

  resident:
    notes:
      - "As a resident you can set off any unused basic exemption limit against short-term gains under Sec 111A and long-term gains under Sec 112A. This is not computed here."
      - "The Sec 87A rebate may reduce the tax on your total income, but it does not apply to the special-rate gains in Sec 111A and 112A. It is not computed here."
      - "Mutual fund sales by residents carry no TDS. You pay the tax as advance tax or when you file."

  interest:
    # VERIFY each year: bank TDS thresholds for residents (Sec 194A), per bank and per year.
    resident_tds_threshold:
      - effective_from: 1900-01-01
        general: 40000
        senior_citizen: 50000
      - effective_from: 2025-04-01
        general: 50000
        senior_citizen: 100000
    resident_tds_rate: 10
    nri_nro_tds_rate: 30       # Sec 195 on NRO account interest, before surcharge and cess
    epf_contribution_limit:    # Interest on employee EPF contributions above this a year is taxable
      with_employer_contribution: 250000
      without_employer_contribution: 500000
