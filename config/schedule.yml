import_mutual_fund_schemes:
  cron: "0 18 * * *" # 11:30 PM IST every day (AMFI publishes the day's NAVs in the evening)
  class: "ImportMutualFundSchemesJob"
  queue: "scheduled"
  description: "Imports AMFI mutual fund schemes and latest NAVs daily at 11:30 PM IST"

import_market_data:
  cron: "30 18 * * *" # 12:00 AM IST every day (after AMFI NAVs are in, before the Indian trading day)
  class: "ImportMarketDataJob"
  queue: "scheduled"
  description: "Imports market data daily at 12:00 AM IST (after AMFI NAVs and NSE/BSE close)"
  args:
    mode: "full"
    clear_cache: false

clean_syncs:
  cron: "0 * * * *" # every hour
  class: "SyncCleanerJob"
  queue: "scheduled"
  description: "Cleans up stale syncs"

run_security_health_checks:
  cron: "0 2 * * 1-5" # 7:30 AM IST (2:00 AM UTC) Monday through Friday
  class: "SecurityHealthCheckJob"
  queue: "scheduled"
  description: "Runs security health checks at 7:30 AM IST Monday through Friday to detect issues with security data"
