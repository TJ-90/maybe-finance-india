import_mutual_fund_schemes:
  cron: "0 18 * * *" # 11:30 PM IST every day (AMFI publishes the day's NAVs in the evening)
  class: "ImportMutualFundSchemesJob"
  queue: "scheduled"
  description: "Imports AMFI mutual fund schemes and latest NAVs daily at 11:30 PM IST"

import_market_data:
  cron: "30 18 * * *" # 12:00 AM IST every day (after AMFI NAVs are in, before the Indian trading day)
  class: "ImportMarketDataJob"
  queue: "scheduled"
  description: "Imports market data daily at 12:00 AM IST (after AMFI NAVs and NSE/BSE close)"
  args:
    mode: "full"
    clear_cache: false

clean_syncs:
  cron: "0 * * * *" # every hour
  class: "SyncCleanerJob"
  queue: "scheduled"
  description: "Cleans up stale syncs"

run_security_health_checks:
  cron: "0 2 * * 1-5" # 7:30 AM IST (2:00 AM UTC) Monday through Friday
  class: "SecurityHealthCheckJob"
  queue: "scheduled"
  description: "Runs security health checks at 7:30 AM IST Monday through Friday to detect issues with security data"

monitor_goals:
  cron: "30 19 * * *" # 1:00 AM IST every day (after the 12:00 AM IST market data refresh and re-valuation)
  class: "MonitorGoalsJob"
  queue: "scheduled"
  description: "Snapshots every goal's health and raises goal status alerts at 1:00 AM IST"

send_reminders:
  cron: "0 20 * * *" # 1:30 AM IST every day
  class: "SendRemindersJob"
  queue: "scheduled"
  description: "Raises stale data, stale NAV, insurance premium and year-end tax reminders at 1:30 AM IST"

send_notification_digests:
  cron: "30 3 * * *" # 9:00 AM IST every day
  class: "SendNotificationDigestsJob"
  queue: "scheduled"
  description: "Emails unread notifications to users who opted in, when SMTP is configured, at 9:00 AM IST"
