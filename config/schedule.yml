import_mutual_fund_schemes:
  cron: "0 18 * * *" # 11:30 PM IST every day (AMFI publishes the day's NAVs in the evening)
  class: "ImportMutualFundSchemesJob"
  queue: "scheduled"
  description: "Imports AMFI mutual fund schemes and latest NAVs daily at 11:30 PM IST"

import_market_data:
  cron: "30 18 * * *" # 12:00 AM IST every day (after AMFI NAVs are in, before the Indian trading day)
  class: "ImportMarketDataJob"
  queue: "scheduled"
  description: "Imports market data (FX rates, catch-up prices) daily at 12:00 AM IST, then re-values accounts"
  args:
    mode: "full"
    clear_cache: false

import_exchange_close_prices:
  cron: "45 10 * * 1-5" # 4:15 PM IST Monday through Friday (NSE/BSE closed at 3:30 PM IST)
  class: "ImportMarketDataJob"
  queue: "scheduled"
  description: "Imports NSE/BSE closing prices at 4:15 PM IST on weekdays, then re-values accounts"
  args:
    mode: "full"
    scope: "exchange_close"

refresh_intraday_prices:
  cron: "*/15 3-10 * * 1-5" # every 15 minutes, 8:30 AM-3:45 PM IST on weekdays; the job only works 9:15 AM-3:30 PM IST
  class: "RefreshIntradayPricesJob"
  queue: "scheduled"
  description: "Refreshes the latest NSE/BSE prices every 15 minutes while the market is open (INTRADAY_PRICE_REFRESH=false turns it off)"

clean_syncs:
  cron: "0 * * * *" # every hour
  class: "SyncCleanerJob"
  queue: "scheduled"
  description: "Cleans up stale syncs"

run_security_health_checks:
  cron: "0 2 * * 1-5" # 7:30 AM IST (2:00 AM UTC) Monday through Friday
  class: "SecurityHealthCheckJob"
  queue: "scheduled"
  description: "Runs security health checks at 7:30 AM IST Monday through Friday to detect issues with security data"
